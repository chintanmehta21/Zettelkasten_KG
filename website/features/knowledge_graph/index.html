<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Knowledge Graph | Zettelkasten</title>
  <link rel="canonical" href="https://zettelkasten.in/knowledge-graph">
  <meta name="description" content="Explore your captured notes as an interactive 3D knowledge graph that automatically links related ideas by shared tags.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Zettelkasten">
  <meta property="og:title" content="Knowledge Graph — Zettelkasten">
  <meta property="og:description" content="Explore your captured notes as an interactive 3D knowledge graph that automatically links related ideas by shared tags.">
  <meta property="og:url" content="https://zettelkasten.in/knowledge-graph">
  <meta property="og:image" content="https://zettelkasten.in/artifacts/og-cover.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Zettelkasten — the second brain you were promised">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Knowledge Graph — Zettelkasten">
  <meta name="twitter:description" content="Explore your captured notes as an interactive 3D knowledge graph that automatically links related ideas by shared tags.">
  <meta name="twitter:image" content="https://zettelkasten.in/artifacts/og-cover.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/kg/css/style.css?v=20260609a">
  <link rel="stylesheet" href="/css/zk_summary_popup.css?v=20260524a">
</head>
<body>
  <!-- Shared-header placeholder intentionally absent on this page. KG
       has its own header.kg-header below; injecting the shared header on
       top of it caused (a) a duplicate-header stack at steady state and
       (b) a giant unstyled back-arrow SVG to render full-screen during
       the brief window before /kg/css/style.css applies. None of the JS
       loaded on this page wires the shared header's avatar dropdown, so
       the shared header was dead chrome here. The literal placeholder
       token is omitted on purpose so _render_with_shell skips injection. -->

  <a class="skip-link" href="#graph-container">Skip to graph</a>
  <!-- Header -->
  <header class="kg-header">
    <div class="kg-header-left">
      <a href="/" class="kg-back" title="Back to Summarizer" aria-label="Back to Summarizer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
      <svg class="kg-logo-icon" width="26" height="26" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="16" y1="5" x2="6" y2="16" stroke="#D4A024" stroke-width="1.2" opacity="0.35"/>
        <line x1="16" y1="5" x2="26" y2="16" stroke="#D4A024" stroke-width="1.2" opacity="0.35"/>
        <line x1="6" y1="16" x2="16" y2="27" stroke="#D4A024" stroke-width="1.2" opacity="0.3"/>
        <line x1="26" y1="16" x2="16" y2="27" stroke="#D4A024" stroke-width="1.2" opacity="0.3"/>
        <line x1="6" y1="16" x2="26" y2="16" stroke="#D4A024" stroke-width="1.2" opacity="0.2"/>
        <line x1="16" y1="5" x2="16" y2="27" stroke="#D4A024" stroke-width="1.2" opacity="0.2"/>
        <circle cx="16" cy="5" r="3" fill="#D4A024"/>
        <circle cx="6" cy="16" r="2.5" fill="#D4A024" opacity="0.8"/>
        <circle cx="26" cy="16" r="2.5" fill="#D4A024" opacity="0.8"/>
        <circle cx="16" cy="27" r="2.5" fill="#D4A024" opacity="0.65"/>
        <circle cx="16" cy="16" r="2" fill="#D4A024" opacity="0.5"/>
      </svg>
      <div class="kg-title-group">
        <h1 class="kg-title">Knowledge Graph</h1>
        <span class="kg-subtitle" id="graph-stats">Loading...</span>
      </div>
    </div>
    <div class="kg-header-right">
      <!-- View toggle: always visible. Personal segment greys out when logged out. -->
      <div class="kg-view-toggle" id="view-toggle" role="tablist" aria-label="Graph scope">
        <button class="kg-view-btn active" data-view="global" type="button" role="tab" aria-selected="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span>Global</span>
        </button>
        <button class="kg-view-btn" data-view="my" type="button" role="tab" aria-selected="false" aria-disabled="true" title="Sign in to switch to Personal">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>Personal</span>
        </button>
      </div>
      <div class="kg-search-wrapper">
        <svg class="kg-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="kg-search" id="search-input" placeholder="Search notes..." autocomplete="off" aria-label="Search notes">
        <span class="kg-search-count hidden" id="search-count" aria-live="polite"></span>
        <button class="kg-search-clear hidden" id="search-clear" type="button" aria-label="Clear search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <!-- Single "All Filters" trigger — mirrors the My Zettels nested
           filter (website/features/user_zettels). The flat scattered
           strength pills + slider now live INSIDE this menu as the
           "Connection strength" sub-section. -->
      <button class="kg-filter-btn" id="filter-btn" type="button" title="Filter notes" aria-label="All filters" aria-haspopup="true" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
        </svg>
      </button>
      <button class="kg-reset-btn" id="reset-view-btn" type="button" title="Reset view" aria-label="Reset view">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Nested "All Filters" menu — same structure/behaviour as the My
       Zettels filter (website/features/user_zettels/index.html): a single
       trigger opens this menu, each parent row reveals a flyout submenu;
       a "Clear Filters" action resets everything. Section bodies keep
       their original ids (filter-source-body / filter-tags-body /
       filter-kastens-body) so app.js render functions are unchanged. -->
  <div class="kg-filter-dropdown hidden" id="filter-dropdown" role="dialog" aria-label="All filters">
    <div class="kg-filter-menu" id="kg-filter-menu" role="menu">
      <button class="kg-filter-parent" id="kg-filter-parent-source" data-submenu="source" type="button" role="menuitem" aria-haspopup="true">
        <span>Source</span>
        <span class="kg-filter-submenu-arrow" aria-hidden="true">&rsaquo;</span>
      </button>
      <button class="kg-filter-parent" id="kg-filter-parent-tags" data-submenu="tags" type="button" role="menuitem" aria-haspopup="true">
        <span>Tags</span>
        <span class="kg-filter-submenu-arrow" aria-hidden="true">&rsaquo;</span>
      </button>
      <button class="kg-filter-parent" id="kg-filter-parent-kastens" data-submenu="kastens" type="button" role="menuitem" aria-haspopup="true">
        <span>Kastens</span>
        <span class="kg-filter-submenu-arrow" aria-hidden="true">&rsaquo;</span>
      </button>
      <button class="kg-filter-parent" id="kg-filter-parent-strength" data-submenu="strength" type="button" role="menuitem" aria-haspopup="true">
        <span>Connection strength</span>
        <span class="kg-filter-submenu-arrow" aria-hidden="true">&rsaquo;</span>
      </button>
      <button class="kg-filter-clear" id="kg-filter-clear" type="button" role="menuitem">Clear Filters</button>

      <div class="kg-filter-submenu" id="kg-submenu-source" data-section="source" role="menu">
        <div class="kg-filter-section-body" id="filter-source-body"></div>
      </div>
      <div class="kg-filter-submenu" id="kg-submenu-tags" data-section="tags" role="menu">
        <div class="kg-filter-section-body" id="filter-tags-body">
          <p class="kg-filter-empty">Loading…</p>
        </div>
      </div>
      <div class="kg-filter-submenu" id="kg-submenu-kastens" data-section="kastens" role="menu">
        <div class="kg-filter-section-body" id="filter-kastens-body">
          <p class="kg-filter-empty" id="filter-kastens-empty">Loading…</p>
        </div>
      </div>
      <!-- Connection-strength sub-section: the relocated Strong/Medium/Weak
           pills + threshold slider. Logic unchanged in app.js; only the
           DOM home + colour (teal, not gold) move. -->
      <div class="kg-filter-submenu" id="kg-submenu-strength" data-section="strength" role="menu">
        <div class="kg-strength-controls" id="strength-controls" role="group" aria-label="Min connection strength">
          <div class="kg-strength-buckets" role="tablist" aria-label="Strength buckets">
            <button type="button" class="kg-strength-bucket active" data-bucket="weak" role="tab" aria-pressed="true" title="Weak and stronger (≥ 0.30)">Weak</button>
            <button type="button" class="kg-strength-bucket" data-bucket="medium" role="tab" aria-pressed="false" title="Medium and stronger (≥ 0.50)">Medium</button>
            <button type="button" class="kg-strength-bucket" data-bucket="strong" role="tab" aria-pressed="false" title="Strong connections only (≥ 0.70)">Strong</button>
          </div>
          <label class="kg-strength-slider-wrap" title="Min connection strength">
            <input type="range" id="strength-slider" min="0.30" max="0.85" step="0.05" value="0.30" aria-label="Min connection strength">
            <span class="kg-strength-value" id="strength-value">0.30</span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Source-type legend — bottom-left "i" info popup. Swatches use the
       ACTUAL per-source node colours from COLORS{} in app.js (populated by
       app.js at boot); colours are NOT changed here. -->
  <button class="kg-legend-btn" id="kg-legend-btn" type="button" title="Source legend" aria-label="Show source-type legend" aria-haspopup="true" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="16" x2="12" y2="12"></line>
      <line x1="12" y1="8" x2="12.01" y2="8"></line>
    </svg>
  </button>
  <div class="kg-legend-popup hidden" id="kg-legend-popup" role="dialog" aria-label="Source-type legend">
    <div class="kg-legend-title">Node sources</div>
    <div class="kg-legend-list" id="kg-legend-list"></div>
  </div>

  <!-- Graph container -->
  <div id="graph-container"></div>

  <!-- A2: analytics-degradation banner (hidden by default; shown when
       Louvain falls back or compute_graph_metrics raised). -->
  <div id="kg-analytics-banner" class="kg-banner hidden" role="status" aria-live="polite"></div>

  <!-- Active-node title — HTML overlay (crisp browser text rendering, no
       Three.js SpriteText artefacts). Positioned each frame by app.js to
       follow the selected/hovered node's projected screen coordinates. -->
  <div id="kg-active-label" class="kg-active-label hidden" aria-hidden="true"></div>

  <!-- Side panel -->
  <aside class="kg-panel hidden" id="side-panel" data-node-id="" aria-label="Note details">
    <div class="kg-panel-content" id="panel-content">
      <header class="kg-panel-meta-row">
        <span class="kg-panel-date hidden" id="panel-date"></span>
        <span class="kg-panel-badge" id="panel-badge">source</span>
        <button class="kg-panel-icon-btn" id="panel-summary-btn" type="button" title="Open full summary" aria-label="Open full summary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="8" y1="13" x2="16" y2="13"></line>
            <line x1="8" y1="17" x2="16" y2="17"></line>
            <line x1="8" y1="9" x2="11" y2="9"></line>
          </svg>
        </button>
        <button class="kg-panel-icon-btn" id="panel-add-kasten" type="button" title="Add to a Kasten" aria-label="Add to a Kasten">
          <span class="kg-panel-icon-mask" style="--mask-url: url(/artifacts/logo-kastens.svg)"></span>
        </button>
        <button class="kg-panel-close" id="panel-close" type="button" title="Close" aria-label="Close details panel">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>
      <h2 class="kg-panel-title" id="panel-title">Note Title</h2>
      <section class="kg-panel-section" data-panel-section="summary">
        <header class="kg-panel-section-header" role="button" tabindex="0" aria-expanded="true">
          <span class="kg-panel-section-title">Summary</span>
          <svg class="kg-panel-section-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </header>
        <div class="kg-panel-section-body">
          <p class="kg-panel-summary" id="panel-summary">Summary goes here...</p>
        </div>
      </section>
      <section class="kg-panel-section" data-panel-section="tags">
        <header class="kg-panel-section-header" role="button" tabindex="0" aria-expanded="true">
          <span class="kg-panel-section-title">Tags</span>
          <svg class="kg-panel-section-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </header>
        <div class="kg-panel-section-body">
          <div class="kg-panel-tags" id="panel-tags"></div>
        </div>
      </section>
      <section class="kg-panel-section" data-panel-section="connections">
        <header class="kg-panel-section-header" role="button" tabindex="0" aria-expanded="true">
          <span class="kg-panel-section-title">Connected Notes</span>
          <svg class="kg-panel-section-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </header>
        <div class="kg-panel-section-body">
          <div class="kg-panel-connections" id="panel-connections"></div>
        </div>
      </section>
    </div>
  </aside>

  <!-- Loading / empty / error overlays -->
  <div class="kg-overlay hidden" id="overlay-loading" aria-live="polite">
    <!-- Mini knowledge-graph animation: nodes + edges fade in (build),
         hold, then fade out (close), looping. Pure CSS keyframes on
         per-element animation-delay; no JS frame loop. Used for every
         KG buffer state (initial load, view switch, strength refetch). -->
    <svg class="kg-loading-network" viewBox="-50 -50 100 100" width="160" height="160" aria-hidden="true">
      <g class="kg-loading-edges">
        <line x1="0" y1="0" x2="0" y2="-32"/>
        <line x1="0" y1="0" x2="28" y2="-16"/>
        <line x1="0" y1="0" x2="28" y2="16"/>
        <line x1="0" y1="0" x2="0" y2="32"/>
        <line x1="0" y1="0" x2="-28" y2="16"/>
        <line x1="0" y1="0" x2="-28" y2="-16"/>
      </g>
      <g class="kg-loading-nodes">
        <circle cx="0" cy="0" r="6" class="kg-loading-center"/>
        <circle cx="0" cy="-32" r="4"/>
        <circle cx="28" cy="-16" r="4"/>
        <circle cx="28" cy="16" r="4"/>
        <circle cx="0" cy="32" r="4"/>
        <circle cx="-28" cy="16" r="4"/>
        <circle cx="-28" cy="-16" r="4"/>
      </g>
    </svg>
    <p class="kg-overlay-text">Loading graph…</p>
  </div>
  <div class="kg-overlay hidden" id="overlay-empty" aria-live="polite">
    <p class="kg-overlay-text" id="overlay-empty-text">No notes match these filters.</p>
    <button class="kg-overlay-btn" id="overlay-empty-reset" type="button">Reset filters</button>
  </div>
  <div class="kg-overlay hidden" id="overlay-error" aria-live="assertive">
    <p class="kg-overlay-text" id="overlay-error-text">Could not load graph data.</p>
    <button class="kg-overlay-btn" id="overlay-error-retry" type="button">Retry</button>
  </div>

  <!-- Add to Kasten modal -->
  <div class="kg-kasten-modal hidden" id="kasten-modal" role="dialog" aria-modal="true" aria-labelledby="kasten-modal-title">
    <div class="kg-kasten-modal-backdrop" id="kasten-modal-backdrop"></div>
    <div class="kg-kasten-modal-card">
      <header class="kg-kasten-modal-header">
        <h2 id="kasten-modal-title">Add to a Kasten</h2>
        <button class="kg-kasten-modal-close" id="kasten-modal-close" type="button" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>
      <p class="kg-kasten-modal-subtitle" id="kasten-modal-note-name"></p>
      <ul class="kg-kasten-modal-list" id="kasten-modal-list" role="listbox" aria-label="Your kastens"></ul>
      <div class="kg-kasten-modal-error hidden" id="kasten-modal-error"></div>
      <footer class="kg-kasten-modal-footer">
        <button class="kg-kasten-modal-cancel" id="kasten-modal-cancel" type="button">Cancel</button>
        <button class="kg-kasten-modal-add" id="kasten-modal-add" type="button" disabled>Add</button>
      </footer>
    </div>
  </div>

  <!-- Shared summary popup: identical visual/behaviour to /home and /home/zettels.
       Loaded with KaTeX + refresh-button so math rendering, PDF download, and
       refresh-this-zettel work without divergence. -->
  <div class="zettels-summary-overlay hidden" id="summary-overlay">
    <div class="zettels-summary-backdrop" id="summary-backdrop"></div>
    <section class="zettels-summary-modal" role="dialog" aria-modal="true" aria-labelledby="summary-title">
      <div class="zettels-summary-actions">
        <button class="zettels-summary-action" id="summary-download" type="button" aria-label="Download summary as PDF" title="Download PDF">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 4V16M12 16L8 12M12 16L16 12M5 20H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
        <button class="zettels-summary-action" id="summary-refresh" type="button" aria-label="Refresh summary. Note: -1 from Zettel balance." title="Refresh summary&#10;Note: -1 from Zettel balance">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M17 8.5A6 6 0 1 0 18 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            <path d="M17 5v4h-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
        <button class="zettels-summary-action zettels-summary-close" id="summary-close" type="button" aria-label="Close summary" title="Close">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </button>
      </div>
      <div class="zettels-summary-meta-row">
        <span class="home-card-date" id="summary-date"></span>
        <span class="home-card-source" id="summary-source">Source</span>
      </div>
      <div class="zettels-summary-refresh-note hidden" id="summary-refresh-note" role="status"></div>
      <h2 class="zettels-summary-title" id="summary-title"></h2>
      <div class="zettels-summary-text" id="summary-text"></div>
      <div class="zettels-summary-tags" id="summary-tags"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three-spritetext@1.10.0/dist/three-spritetext.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.79.1/dist/3d-force-graph.min.js"></script>
  <script src="/user-pricing/js/purchase_launcher.js?v=20260517d"></script>
  <link rel="stylesheet" href="/functional-gates/css/quota_gate.css?v=20260517d">
  <script src="/functional-gates/js/quota_gate.js?v=20260517d"></script>
  <link rel="stylesheet" href="/refresh-button/static/refresh_button.css?v=20260523d">
  <script src="/refresh-button/static/refresh_button.js?v=20260523d"></script>
  <script defer src="/vendor/katex/katex.min.js?v=20260519c"></script>
  <script defer src="/vendor/katex/contrib/auto-render.min.js?v=20260519c"></script>
