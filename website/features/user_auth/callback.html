<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Signing in | Zettelkasten</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106"></script>
    <script src="/browser-cache/js/cache.js?v=20260609a"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: hsl(224, 28%, 5%);
            color: hsl(210, 20%, 92%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .callback-card {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid hsl(220, 16%, 14%);
            border-top-color: hsl(172, 66%, 50%);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status { color: hsl(215, 14%, 58%); font-size: 0.9rem; }
        .error { color: hsl(0, 72%, 63%); margin-top: 1rem; }
        .retry-link {
            color: hsl(172, 66%, 50%);
            text-decoration: none;
            margin-top: 0.5rem;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="callback-card" aria-live="polite">
        <div class="spinner" id="spinner"></div>
        <p class="status" id="status">Completing sign-in…</p>
        <p class="error" id="error" style="display:none"></p>
        <a class="retry-link" id="retry" href="/" style="display:none">Back to home</a>
    </div>

    <script>
    (async function() {
        var statusEl = document.getElementById('status');
        var errorEl = document.getElementById('error');
        var spinnerEl = document.getElementById('spinner');
        var retryEl = document.getElementById('retry');

        function isSafePath(value) {
            // Reject protocol-relative (//host) + backslash/control-char tricks
            // ('/\\evil.com', '/\t/evil.com') browsers normalise to an external
            // origin (open-redirect guard). Mirrors _safe_return_to in routes.py.
            return typeof value === 'string' && value.length > 0 && value[0] === '/'
                && value.indexOf('//') !== 0 && value.indexOf('\\') === -1
                && !/[\t\n\r]/.test(value);
        }

        try {
            var configResp = await fetch('/api/auth/config');
            var config = await configResp.json();

            if (!config.supabase_url || !config.supabase_anon_key) {
                throw new Error('Authentication is not configured on this server.');
            }

            var createClient = supabase.createClient;
            var sb = createClient(config.supabase_url, config.supabase_anon_key, {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    // detectSessionInUrl: true auto-exchanges ?code= in createClient().
                    // flowType: 'pkce' explicit per Supabase docs (default differs between
                    // local and hosted projects). Calling exchangeCodeForSession again here
                    // would burn the (single-use) verifier and surface a spurious
                    // "Sign-in failed: …" toast (supabase/auth-js#1026, #782).
                    detectSessionInUrl: true,
                    flowType: 'pkce',
                    storage: window.localStorage,
                    storageKey: 'zk-auth-token',
                }
            });

            // initialize() returns the real exchange error when detectSessionInUrl
            // fails internally; getSession() does NOT replay it (verified in
            // GoTrueClient.ts _initialize branch). Race against a 12s timeout to
            // guard against the infinite-lock deadlock documented in
            // supabase-js #1594 / #2013 (iOS WebKit + cross-tab). 12s leaves
            // ~6s headroom over Supabase token-exchange p99 on slow 3G.
            // Defensive typeof: initialize() is public in current auth-js but
            // marked @experimental in some 2.x minors — fall back to a plain
            // getSession() if absent so we never throw "is not a function".
            var initResult = null;
            if (typeof sb.auth.initialize === 'function') {
                var INIT_TIMEOUT_MS = 12000;
                initResult = await Promise.race([
                    sb.auth.initialize(),
                    new Promise(function (_resolve, reject) {
                        setTimeout(function () {
                            reject(new Error('Auth init timed out after ' + (INIT_TIMEOUT_MS / 1000) + 's (possible lock deadlock)'));
                        }, INIT_TIMEOUT_MS);
                    })
                ]);
            }
            if (initResult && initResult.error) {
                var initErr = initResult.error;
                // Common cause for "No session" after a successful Supabase user
                // creation: PKCE code_verifier missing in localStorage — the
                // initiating client wasn't in pkce flow, or the user started OAuth
                // in a different storage partition (PWA vs Safari tab, in-app
                // browser). Surface the hint so the next user report is
                // diagnosable from the toast alone.
                var hint = '';
                try {
                    if (!window.localStorage.getItem('zk-auth-token-code-verifier')) {
                        hint = ' [no PKCE verifier — retry from a fresh tab]';
                    }
                } catch (_storageErr) {
                    hint = ' [localStorage blocked — Lockdown / private mode?]';
                }
                throw new Error('OAuth exchange failed: ' + (initErr.message || initErr.code || 'unknown') + hint);
            }
            var sessionResult = await sb.auth.getSession();
            if (sessionResult.error || !sessionResult.data || !sessionResult.data.session) {
                throw sessionResult.error || new Error('OAuth completed but no session in storage (storage adapter issue?)');
            }

            statusEl.textContent = 'Signed in! Redirecting...';
            if (window.browserCache && typeof window.browserCache.patchState === 'function') {
                window.browserCache.patchState({
                    hasLoggedIn: true,
                    allowCredentialStorage: true,
                    landingPath: '/home'
                });
            }

            var returnTo = null;
            if (window.browserCache && typeof window.browserCache.consumeReturnPath === 'function') {
                returnTo = window.browserCache.consumeReturnPath();
            }
            if (!returnTo) {
                returnTo = sessionStorage.getItem('zk.bc.return.v1') || sessionStorage.getItem('auth_return_to') || '/home';
                sessionStorage.removeItem('zk.bc.return.v1');
                sessionStorage.removeItem('auth_return_to');
            }
            if (!isSafePath(returnTo)) {
                returnTo = '/home';
            }
            window.location.replace(returnTo);
        } catch (err) {
            spinnerEl.style.display = 'none';
            statusEl.style.display = 'none';
            errorEl.style.display = 'block';
            errorEl.textContent = 'Sign-in failed: ' + (err.message || 'Unknown error');
            retryEl.style.display = 'inline-block';
        }
    })();
    </script>
</body>
</html>
