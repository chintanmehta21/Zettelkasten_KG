name: Read Recent Logs

# iter-03 §1D.1: on-demand droplet log fetcher. SSHes to the production
# droplet, tails the active (or specified) blue/green container's logs,
# uploads them as a workflow artifact for download. Useful for post-incident
# triage without needing direct SSH access from a laptop.

on:
  workflow_dispatch:
    inputs:
      tail_lines:
        description: "Number of log lines to tail (docker compose logs / caddy access)"
        type: number
        default: 500
      color:
        description: "Color (blue / green / auto)"
        type: choice
        options: [auto, blue, green]
        default: auto
      # iter-09 Task 6 — windowed log retrieval for q5 500 root-cause and other
      # post-incident triage. `since` accepts journalctl --since formats
      # (RFC3339, "6 hours ago", "yesterday", etc.). When set, journalctl runs
      # with --since "$since" --lines $lines instead of the default --since "6
      # hours ago" + grep filter.
      lines:
        description: "journalctl --lines (default 5000 when since is set)"
        type: number
        default: 5000
      since:
        description: 'journalctl --since (e.g. 2026-05-03T15:48:00Z); empty = default 6h grep window'
        type: string
        default: ""

jobs:
  tail:
    runs-on: ubuntu-latest
    # Production-scoped secrets (DROPLET_HOST etc.) live on the `production`
    # environment — the deploy-droplet workflow uses the same scope.
    environment: production
    timeout-minutes: 5
    steps:
      - name: SSH dump container logs + dmesg + free + caddy access (inline stdout)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_SSH_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          # 2026-07-31: capture_stdout must stay FALSE. The remote stdout always
          # streams into the job log; true additionally stores it as a step
          # output, and on large dumps (>~8MB) evaluating that output blows the
          # GH expression memory limit — the run is marked "failure" after the
          # SSH script fully succeeded (appleboy action.yml outputs.stdout).
          capture_stdout: false
          script: |
            set -euo pipefail
            COLOR="${{ inputs.color }}"
            if [ "$COLOR" = "auto" ]; then
                COLOR="$(cat /opt/zettelkasten/ACTIVE_COLOR 2>/dev/null || echo blue)"
            fi
            LINES=${{ inputs.tail_lines }}
            JCTL_LINES=${{ inputs.lines }}
            JCTL_SINCE='${{ inputs.since }}'
            echo "===== [read_recent_logs] color=$COLOR lines=$LINES jctl_lines=$JCTL_LINES jctl_since=$JCTL_SINCE ====="
            echo "===== compose/.env operational vars (GUNICORN/RAG/no secrets) ====="
            # iter-10 prep: doc/code drift audit on GUNICORN_TIMEOUT etc. Safe to
            # dump these — they are operational, not secrets. Greps explicitly
            # exclude TOKEN/KEY/PASSWORD/SECRET patterns as defence-in-depth.
            grep -E '^(GUNICORN_|RAG_|EVAL_|ROUTER_)[A-Z_]+=' /opt/zettelkasten/compose/.env 2>/dev/null \
              | grep -viE 'token|key|password|secret' || echo "  (file unreadable or empty)"
            echo "===== free -h ====="
            free -h
            echo "===== docker ps ====="
            # deploy user is in the docker group — no sudo needed (and the
            # droplet sudoers config has no NOPASSWD rule for `docker`).
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
            echo "===== docker inspect (OOMKilled / ExitCode / RestartCount) ====="
            for c in zettelkasten-blue zettelkasten-green caddy; do
              docker inspect "$c" --format \
                'name={{.Name}} oom_killed={{.State.OOMKilled}} exit={{.State.ExitCode}} restarts={{.RestartCount}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' \
                2>/dev/null || echo "  (no $c container)"
            done
            echo "===== docker events (last 6h, oom + die only) ====="
            docker events --since 6h --until 0m \
              --filter event=oom --filter event=die --filter event=kill \
              --format 'time={{.Time}} type={{.Type}} action={{.Action}} actor={{.Actor.Attributes.name}}' \
              2>/dev/null || true
            echo "===== cgroup v2 memory.events (OOM counters per-container) ====="
            for f in /sys/fs/cgroup/system.slice/docker-*.scope/memory.events; do
              [ -r "$f" ] || continue
              echo "--- $f ---"
              cat "$f" 2>/dev/null || true
            done
            echo "===== cgroup v2 memory.peak (per-container hi-water) ====="
            for f in /sys/fs/cgroup/system.slice/docker-*.scope/memory.peak; do
              [ -r "$f" ] || continue
              echo "$f: $(cat "$f" 2>/dev/null)"
            done
            echo "===== cgroup v2 memory.stat (anon/file/slab/swap breakdown) ====="
            for f in /sys/fs/cgroup/system.slice/docker-*.scope/memory.stat; do
              [ -r "$f" ] || continue
              echo "--- $f ---"
              cat "$f" 2>/dev/null | head -25
            done
            echo "===== top -bn1 -o RES (top 8 by RSS) ====="
            top -bn1 -o RES 2>&1 | head -15 || true
            echo "===== docker exec proc memory per worker (RSS+swap) ====="
            for c in zettelkasten-blue zettelkasten-green; do
              [ -n "$(docker ps -q -f name=$c)" ] || continue
              echo "--- $c ---"
              docker exec "$c" sh -c '
                for pid in $(pgrep -f "gunicorn|uvicorn|python" 2>/dev/null); do
                  [ -r /proc/$pid/status ] || continue
                  echo "pid=$pid $(grep -E "^(Name|VmRSS|VmSwap|VmSize|RssAnon|RssFile|RssShmem)" /proc/$pid/status | tr "\n" " ")"
                done
              ' 2>/dev/null || echo "  (exec failed)"
            done
            echo "===== docker exec smaps_rollup (swap by category, blue+green) ====="
            for c in zettelkasten-blue zettelkasten-green; do
              [ -n "$(docker ps -q -f name=$c)" ] || continue
              echo "--- $c ---"
              docker exec "$c" sh -c '
                for pid in $(pgrep -f "gunicorn|uvicorn|python" 2>/dev/null | head -3); do
                  [ -r /proc/$pid/smaps_rollup ] || continue
                  echo "  pid=$pid:"
                  grep -E "^(Rss|Pss|Anonymous|Swap|Shared_|Private_)" /proc/$pid/smaps_rollup 2>/dev/null \
                    | sed "s/^/    /"
                done
              ' 2>/dev/null || echo "  (exec failed)"
            done
            echo "===== journalctl -k (kernel ring; OOM only, last 6h) ====="
            # systemd-journal group membership grants kernel-message read; if
            # not granted this returns an error but doesn't fail the script.
            journalctl -k --since "6 hours ago" --no-pager 2>&1 \
              | grep -iE 'oom|out of memory|killed process|invoked oom' \
              | head -50 \
              || echo "  (no kernel OOM events found, or journal not readable by deploy user)"
            if [ -n "$JCTL_SINCE" ]; then
              # 2026-05-25 fix (Nimit observability PR): journalctl --since
              # rejects RFC3339 (`2026-05-22T16:00:00Z`) — it wants
              # `YYYY-MM-DD HH:MM:SS`. The input format the rest of the
              # workflow accepts is RFC3339, so translate inline before
              # passing to journalctl. Docker compose accepts both, so its
              # branch below is unaffected by the rewrite.
              JCTL_SINCE_FMT="$(echo "$JCTL_SINCE" | sed -e 's/T/ /' -e 's/Z$//')"
              echo "===== journalctl windowed (--since '$JCTL_SINCE_FMT' --lines $JCTL_LINES) ====="
              # iter-09 Task 6: full windowed dump (no OOM-only filter). Used to
              # surface app tracebacks around a known incident timestamp.
              journalctl --since "$JCTL_SINCE_FMT" --lines "$JCTL_LINES" --no-pager 2>&1 \
                || echo "  (journalctl windowed read failed)"
            fi
            echo "===== /var/log/kern.log + /var/log/syslog (OOM grep; if readable) ====="
            for log in /var/log/kern.log /var/log/syslog; do
              [ -r "$log" ] || continue
              echo "--- $log ---"
              grep -iE 'oom|out of memory|killed process' "$log" 2>/dev/null \
                | tail -50 || true
            done
            echo "===== app container logs (--tail $LINES) ====="
            cd /opt/zettelkasten/compose
            docker compose -f docker-compose.${COLOR}.yml logs --tail ${LINES} 2>&1 || true
            if [ -n "$JCTL_SINCE" ]; then
              # docker compose logs accepts RFC3339 / unix-ts / relative duration.
              # journalctl wants "YYYY-MM-DD HH:MM:SS"; we accept either input
              # shape and translate "YYYY-MM-DD HH:MM:SS" -> "YYYY-MM-DDTHH:MM:SS"
              # (Docker treats trailing Z as UTC, no Z = UTC also fine).
              DOCKER_SINCE="$(echo "$JCTL_SINCE" | sed 's/ /T/')"
              echo "===== app container logs (--since '$DOCKER_SINCE') ====="
              # iter-09 Task 6: windowed app log dump for post-incident triage.
              # Far more useful than tail_lines for known-timestamp incidents
              # (q5 500 @ 15:50:43 etc) since the journalctl path is blind to
              # container stdout when deploy is not in systemd-journal group.
              docker compose -f docker-compose.${COLOR}.yml logs --since "$DOCKER_SINCE" 2>&1 | head -2000 || true
            fi
            # 2026-08-01: deploy.sh::restore_previous_color dumps the logs of a
            # container that failed the smoke gate here before removing it.
            # These are the only record of WHY a cutover was refused.
            echo "===== failed-container captures (smoke-gate aborts) ====="
            ls -lt /opt/zettelkasten/logs/failed-*.log 2>/dev/null | head -10 || echo "  (none)"
            for f in $(ls -t /opt/zettelkasten/logs/failed-*.log 2>/dev/null | head -2); do
              echo "--- $f (last 200) ---"
              tail -n 200 "$f" 2>/dev/null || true
            done
            echo "===== caddy access (last $LINES) ====="
            # /opt/zettelkasten/logs/caddy is owned by deploy:deploy per
            # deploy.sh — readable directly without sudo.
            tail -n ${LINES} /opt/zettelkasten/logs/caddy/access.log 2>/dev/null || true
            # 2026-07-31: also surface Caddy's self-rolled access logs (live file
            # covers ~1 day only). Per-file tail keeps output bounded.
            echo "===== caddy access rolled files (dir listing + per-file tail $LINES) ====="
            ls -lt /opt/zettelkasten/logs/caddy/ 2>/dev/null || true
            for f in /opt/zettelkasten/logs/caddy/access-*.log*; do
              [ -e "$f" ] || continue
              echo "--- $f ---"
              zcat -f "$f" 2>/dev/null | tail -n ${LINES} || true
            done
            # Read-only caddy upstream/admin diagnostics — surfaces the
            # deploy-cutover failure mode (first `caddy reload` per deploy
            # fails verify -> restart -> broken health wait -> rollback).
            echo "===== [caddy-cutover-diag] (read-only) ====="
            SNIP=/opt/zettelkasten/caddy/upstream.snippet
            AUTO=/opt/zettelkasten/caddy/config/caddy/autosave.json
            echo "--- upstream token: snippet vs autosave (steady-state should MATCH) ---"
            echo "snippet : $(grep -oE 'zettelkasten-(blue|green):10000' "$SNIP" 2>/dev/null | head -1)"
            echo "autosave: $(grep -oE 'zettelkasten-(blue|green):10000' "$AUTO" 2>/dev/null | head -1)"
            echo "--- autosave.json + snippet stat (owner / mtime) ---"
            ls -l "$AUTO" "$SNIP" 2>&1 || echo "(missing)"
            echo "--- /config dirs (autosave writability by caddy uid) ---"
            ls -ld /opt/zettelkasten/caddy/config /opt/zettelkasten/caddy/config/caddy 2>&1 || true
            echo "--- caddy container (user / init / health / started) ---"
            docker inspect caddy --format 'user={{.Config.User}} init={{.HostConfig.Init}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} started={{.State.StartedAt}}' 2>&1 || true
            echo "--- caddy admin reachability (exactly the Docker healthcheck cmd) ---"
            docker exec caddy wget --quiet --tries=1 --spider http://localhost:2019/config/ 2>&1 && DIAG_RC=0 || DIAG_RC=$?
            echo "healthcheck_wget_exit=${DIAG_RC}"
            # 2026-07-31 P3 probe: busybox wget resolves localhost -> ::1 first
            # with no IPv4 fallback; admin binds 127.0.0.1 only. If the explicit
            # IPv4 probe passes while the localhost one fails, the healthcheck
            # URL (not the admin endpoint) is the bug.
            docker exec caddy wget --quiet --tries=1 --spider http://127.0.0.1:2019/config/ 2>&1 && DIAG4_RC=0 || DIAG4_RC=$?
            echo "healthcheck_wget_ipv4_exit=${DIAG4_RC}"
            echo "--- live admin config upstream (what caddy actually serves NOW) ---"
            docker exec caddy sh -c 'wget -qO- http://localhost:2019/config/ 2>/dev/null' 2>/dev/null | grep -oE 'zettelkasten-(blue|green):10000' | sort -u || echo "(admin GET failed/empty)"
            echo "--- caddy version ---"
            docker exec caddy caddy version 2>&1 | head -1 || true
            echo "===== END ====="
