name: Live integration tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 0"

permissions:
  contents: read

jobs:
  live:
    name: pytest --live (real APIs)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ops/requirements.txt
            ops/requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r ops/requirements-dev.txt

      - name: pytest --live
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # 2026-07-31: v2 integration fixtures (asyncpg_pool) require the direct
          # DSN; missing since the suite grew v2 coverage — every weekly run
          # errored at setup from 2026-05-31 onward.
          SUPABASE_V2_DATABASE_URL: ${{ secrets.SUPABASE_V2_DATABASE_URL }}
          # 2026-08-01: adding the DSN cut setup errors 221 -> 35, but the v2
          # app fixtures still could not build a PostgREST client. get_v2_config
          # resolves SUPABASE_V2_* first and falls back to these canonical
          # names (client.py::_v2_env) — and the service-role key was never
          # passed here at all. Mirrors cleanup-test-fixtures.yml, which works.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          # 2026-08-01 ROOT CAUSE of 228/248 failures since 2026-05-31.
          # Seven unit-test modules run os.environ.setdefault("SUPABASE_V2_URL",
          # "https://ci-stub.supabase.co") at MODULE level. pytest imports every
          # module during collection, so the stub lands process-wide before any
          # test runs, and setdefault (unlike monkeypatch) is never reverted.
          # client.py::_v2_env reads SUPABASE_V2_* FIRST and only falls back to
          # the canonical names, so the stub outranked the real secrets above;
          # get_v2_client is lru_cached with no cache_clear anywhere, so one
          # poisoned client served the whole session -> NXDOMAIN on
          # ci-stub.supabase.co -> "[Errno -2] Name or service not known".
          # Setting the V2 names explicitly makes those setdefault calls no-ops.
          SUPABASE_V2_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_V2_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_V2_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pytest --live -q
