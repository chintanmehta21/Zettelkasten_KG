name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ops/requirements.txt
            ops/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ops/requirements-dev.txt

      - name: Run pytest
        env:
          GEMINI_API_KEY: "ci-stub"
          # Stubs for the v2 Supabase client so module-level / fallback
          # constructor paths don't fail validation under unit-test mocks.
          # Tests inject MagicMock clients — these values are never used to
          # make network calls; they only let get_v2_client() construct.
          SUPABASE_V2_URL: "https://ci-stub.supabase.co"
          SUPABASE_V2_ANON_KEY: "ci-stub-anon"
          SUPABASE_V2_SERVICE_ROLE_KEY: "ci-stub-service"
          NEXUS_TOKEN_ENCRYPTION_KEY: "7TgtMgeR5dMTnXxW6ULICwhf66A1VpzwuNFuIBqmoe4="
        run: |
          # Deselect the Playwright browser suite. tests/conftest.py already
          # adds a collection-time skip for the `e2e` marker, but that is NOT
          # sufficient in CI: pytest-playwright still sets up its browser
          # fixture and every e2e test ERRORs with "BrowserType.launch:
          # Executable doesn't exist" (playwright 1.60 wants chromium build
          # 1223, absent from the runner image). That is why master@20292452's
          # own ci.yml run is currently red. Verified by A/B in CI on this PR:
          # green WITH this flag, red WITHOUT it. Marker deselection happens
          # before fixture setup, so it actually holds.
          # Keep it HERE, not in pyproject addopts — a global `-m "not e2e"`
          # would make e2e.yml (which runs tests/integration/browser/ with a
          # real `playwright install`) collect zero tests and trip its own
          # "0 tests collected" guard.
          pytest -q --maxfail=5 -m "not e2e"

  stylelint-changed:
    name: stylelint (changed CSS lines)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run lint:css:changed
