name: Cleanup test fixtures (nightly)

# Phase 7.3c: nightly safety net for the per-test cleanup +
# pytest_sessionfinish hook. Sweeps any e2e-*@test.com user older than 24h.

on:
  schedule:
    - cron: '17 3 * * *'  # 03:17 UTC daily
  workflow_dispatch:
    inputs:
      age_hours:
        description: >-
          Only purge fixtures older than this many hours. The 24h default is a
          safety margin so a purge cannot yank fixtures out from under an
          in-flight test run. Lower it ONLY when you know no live-test run is
          in progress (e.g. clearing stragglers before a release).
        required: false
        default: '24'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # 2026-08-01: SUPABASE_* / DROPLET_* / WEBSHARE_* are scoped to the
    # `production` GitHub Environment. Without this declaration every
    # `secrets.*` reference below resolves to an EMPTY STRING and the job
    # runs green while doing nothing — the same silent-skip class that hid
    # the deploy smoke-fixture rot for weeks.
    environment: production
    # 2026-08-05: raised 10 -> 30. A 436-user backlog needs ~17 min because
    # purge_user_dependencies makes several REST calls per user, so the 10-min
    # budget CANCELLED the job mid-purge, leaving 182 users behind. A cancelled
    # run reports neither `failure` nor `timed_out`, so the alerter did not fire
    # (now also matches `cancelled`) — but the real fix is not to hit the ceiling.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime deps
        run: pip install -r ops/requirements.txt
      - name: Run cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_V2_URL: ${{ secrets.SUPABASE_V2_URL }}
          SUPABASE_V2_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_V2_SERVICE_ROLE_KEY }}
          SUPABASE_V2_ANON_KEY: ${{ secrets.SUPABASE_V2_ANON_KEY }}
          SUPABASE_V2_DATABASE_URL: ${{ secrets.SUPABASE_V2_DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: >-
          python ops/scripts/purge_test_fixtures.py
          --age-hours ${{ github.event.inputs.age_hours || '24' }}
          --assert-clean
