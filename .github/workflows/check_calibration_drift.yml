# iter-03 §9: weekly corpus drift detector. If drift exceeds thresholds,
# refreshes calibration parquet + int8 ONNX and opens a PR for human review.
name: Calibration drift check
on:
  schedule:
    - cron: "0 2 * * 0"   # Sunday 02:00 UTC
  workflow_dispatch:       # allow manual trigger from GH UI
permissions:
  contents: write
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    # 2026-08-01: SUPABASE_* / DROPLET_* / WEBSHARE_* are scoped to the
    # `production` GitHub Environment. Without this declaration every
    # `secrets.*` reference below resolves to an EMPTY STRING and the job
    # runs green while doing nothing — the same silent-skip class that hid
    # the deploy smoke-fixture rot for weeks.
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime + dev requirements
        run: |
          pip install --no-cache-dir -r ops/requirements.txt
          pip install --no-cache-dir -r ops/requirements-dev.txt
      - name: Run drift detector
        id: drift
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          python ops/scripts/check_corpus_drift.py --current-from-supabase --report-out drift_report.json
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 2026-08-01: rc=1 is overloaded and was being MISREAD.
          # check_corpus_drift._load_supabase_stats raises NotImplementedError
          # unconditionally (the --current-from-supabase path was purged with
          # DB v2), so this step exits 1 on EVERY run. The downstream step
          # keys on rc == '1' and interprets it as "drift detected", then runs
          # a refresh script that hardcodes a legacy v1 kg_users id and reads
          # SUPABASE_DB_URL (absent here) against tables dropped in Phase 6.
          # So: red every Sunday, for a reason unrelated to drift.
          # Distinguish "the detector could not run" from "drift found" —
          # a check that cannot run must never be read as a positive result.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::drift detector exited rc=$rc (could not run)"
          fi
          if grep -q "NotImplementedError" drift_report.json 2>/dev/null || [ ! -s drift_report.json ]; then
            echo "unavailable=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Drift detector is NOT OPERATIONAL — the"
            echo "::warning::--current-from-supabase path was purged with DB v2 and"
            echo "::warning::raises NotImplementedError. This job cannot detect drift."
            echo "::warning::Do not treat its result as a drift signal. Tracked as"
            echo "::warning::item 4.4 in docs/claude_audits/hardening_plan_2026-08-01.md"
          fi
      - name: Upload drift report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift_report.json
      - name: Refresh calibration + int8 (drift detected)
        # 2026-08-01: added `unavailable != 'true'` so a detector that could
        # not run no longer triggers a refresh it has no evidence to justify.
        if: steps.drift.outputs.rc == '1' && steps.drift.outputs.unavailable != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python ops/scripts/refresh_calibration_and_int8.py
      - name: Open PR with refreshed artifacts
        if: steps.drift.outputs.rc == '1'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/calibration-refresh-${{ github.run_id }}
          title: "chore: auto refresh int8 calibration"
          commit-message: "chore: refresh int8 calibration corpus drift"
          body-path: drift_report.json
          add-paths: |
            models/bge-reranker-base-int8.onnx
            models/bge_calibration_pairs.parquet
            models/calibration_baseline.json
