name: Postman view-graph API

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Base URL to test, for example https://zettelkasten.in"
        required: true
        default: "https://zettelkasten.in"
      live_requests:
        description: "Set true to execute requests; false validates the collection without hitting a target"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: postman-graph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postman:
    name: Newman view-graph suite
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Create dated result tree
        id: results
        shell: bash
        run: |
          set -euo pipefail
          DATE_DIR="$(date -u +%F)"
          TIME_DIR="$(date -u +%H%M%S)-run-${GITHUB_RUN_ID}"
          RESULT_DIR="docs/postman_results/${DATE_DIR}/${TIME_DIR}-graph"
          mkdir -p "${RESULT_DIR}"
          echo "dir=${RESULT_DIR}" >> "${GITHUB_OUTPUT}"
          echo "date_dir=${DATE_DIR}" >> "${GITHUB_OUTPUT}"
          echo "time_dir=${TIME_DIR}" >> "${GITHUB_OUTPUT}"

      - name: Preflight — auth tokens must exist when live requests are on
        # 2026-08-01. These four suites were GREEN for months while executing
        # nothing: POSTMAN_AUTH_TOKEN_USER_A/B are not registered as secrets, so
        # the collection's pre-request hook skipped every authenticated request
        # via `pm.test('SKIPPED: ...', () => pm.expect(true).to.equal(true))` —
        # a PASSING assertion — then called pm.execution.skipRequest(). Newman
        # exited 0 and the job reported success, including for every cross-tenant
        # BOLA denial test. That is the same "a gate that cannot run must not
        # report success" defect that hid the deploy smoke-fixture rot.
        if: inputs.live_requests == 'true'
        shell: bash
        env:
          AUTH_TOKEN_USER_A: ${{ secrets.POSTMAN_AUTH_TOKEN_USER_A }}
          AUTH_TOKEN_USER_B: ${{ secrets.POSTMAN_AUTH_TOKEN_USER_B }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "${AUTH_TOKEN_USER_A:-}" ] || { echo "::error::POSTMAN_AUTH_TOKEN_USER_A is not set"; missing=1; }
          [ -n "${AUTH_TOKEN_USER_B:-}" ] || { echo "::error::POSTMAN_AUTH_TOKEN_USER_B is not set"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "::error::Refusing to run with live_requests=true: every authenticated"
            echo "::error::request would be SKIPPED and the suite would still report success."
            echo "::error::Note these are short-lived JWTs; a static secret expires in ~1h."
            echo "::error::See docs/claude_audits/hardening_plan_2026-08-01.md item 4.1."
            exit 1
          fi
          echo "auth tokens present"

      - name: Install Newman
        run: npm install --no-save newman

      - name: Render runtime environment
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target_url }}
          RUN_LIVE_REQUESTS: ${{ inputs.live_requests }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTH_TOKEN_USER_A: ${{ secrets.POSTMAN_AUTH_TOKEN_USER_A }}
          AUTH_TOKEN_USER_B: ${{ secrets.POSTMAN_AUTH_TOKEN_USER_B }}
        run: |
          set -euo pipefail
          node tests/postman/scripts/render-environment.mjs \
            tests/postman/environments/zettelkasten.local.template.postman_environment.json \
            "${RUNNER_TEMP}/postman-runtime-environment.json"
          node tests/postman/scripts/render-environment.mjs \
            tests/postman/environments/zettelkasten.local.template.postman_environment.json \
            "${{ steps.results.outputs.dir }}/environment.sanitized.postman_environment.json" \
            --sanitize

      - name: Validate collection without live requests
        if: inputs.live_requests != 'true'
        shell: bash
        env:
          COLLECTION: tests/postman/collections/zettelkasten-graph.postman_collection.json
          ENVIRONMENT: tests/postman/environments/zettelkasten.local.template.postman_environment.json
          REPORT_DIR: ${{ steps.results.outputs.dir }}
        run: |
          set -euo pipefail
          node tests/postman/scripts/validate-postman-files.mjs
          bash tests/postman/ci/run-newman.sh
          cp tests/postman/collections/zettelkasten-graph.postman_collection.json "${{ steps.results.outputs.dir }}/"
          cp tests/postman/environments/zettelkasten.local.template.postman_environment.json "${{ steps.results.outputs.dir }}/environment.template.postman_environment.json"

      - name: Run Newman collection
        if: inputs.live_requests == 'true'
        shell: bash
        env:
          COLLECTION: tests/postman/collections/zettelkasten-graph.postman_collection.json
          ENVIRONMENT: ${{ runner.temp }}/postman-runtime-environment.json
          REPORT_DIR: ${{ steps.results.outputs.dir }}
        run: bash tests/postman/ci/run-newman.sh

      - name: Write run manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > "${{ steps.results.outputs.dir }}/manifest.json" <<EOF
          {
            "workflow": "postman-graph.yml",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "sha": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "target_url": "${{ inputs.target_url }}",
            "live_requests": "${{ inputs.live_requests }}",
            "result_dir": "${{ steps.results.outputs.dir }}"
          }
          EOF

      - name: Upload structured Postman artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-results-graph-${{ steps.results.outputs.date_dir }}-${{ steps.results.outputs.time_dir }}
          path: ${{ steps.results.outputs.dir }}/
          if-no-files-found: error
          retention-days: 30
