# supabase/config.toml — CI-only config consumed by `supabase start`.
#
# Sole purpose right now: point the local supabase_db container at a custom
# Postgres image that includes pg_partman, so migrate-v2-fresh can apply
# supabase/website/_v2/00_extensions.sql against a fresh stack the same way
# production Supabase (which ships pg_partman 5.3.1) does.
#
# The custom image is built locally per CI run in .github/workflows/migration-ci.yml
# via `docker build -f ci/Dockerfile.zettelkasten-postgres -t zettelkasten/postgres-with-partman:local ci/`.
#
# Production deploys are unaffected — managed Supabase is provisioned outside
# this file.

project_id = "zettelkasten-ci"

[db]
image = "zettelkasten/postgres-with-partman:local"
