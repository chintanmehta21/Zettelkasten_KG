services:
  zettelkasten-green:
    image: ghcr.io/chintanmehta21/zettelkasten-kg-website:${IMAGE_TAG:-latest}
    container_name: zettelkasten-green
    hostname: zettelkasten-green
    restart: unless-stopped
    env_file:
      - path: /opt/zettelkasten/compose/.env
        required: true
      - path: /opt/zettelkasten/compose/.env.local
        required: false
    environment:
      NEXUS_ENABLED: "true"
      # iter-03 §6: models are baked into the image read-only; runtime writes
      # go to /app/runtime via the mount below.
      RAG_DEGRADATION_LOG_DIR: "/app/runtime"
      # iter-06: trim bounded-queue depth so burst overload sheds via 503+Retry-After
      # instead of stacking until Cloudflare 524 (iter-05 saw 11×524 / 1×200).
      # cluster cap = RAG_QUEUE_MAX × workers = 3 × 2 = 6 in-flight + queued.
      RAG_QUEUE_MAX: "3"
      RAG_RERANK_CONCURRENCY: "2"
      # YouTube transcript tier reads browser cookies from this path to get
      # past the datacenter-IP bot wall. Mounted read-only from the host
      # (see volumes). The host file MUST exist before the container starts.
      YT_COOKIES_PATH: "/opt/zk/yt-cookies.txt"
    ports:
      - "127.0.0.1:10001:10000"
    networks:
      - zettelnet
    volumes:
      - /opt/zettelkasten/data/kg_output:/app/kg_output
      - /opt/zettelkasten/data/bot_data:/app/bot_data
      # iter-03 §6: models live inside the image; runtime writes (e.g. the
      # cascade-reranker degradation log) go to a separate writable mount.
      - /opt/zettelkasten/data/runtime:/app/runtime:rw
      # YouTube cookies (Netscape format), refreshed manually on the host.
      - /opt/zettelkasten/data/yt-cookies.txt:/opt/zk/yt-cookies.txt:ro
    # iter-03 mem-bounded: cgroup ceiling 1600m + 1000m swap budget.
    # Original 1300m proved too tight under realistic q1 multi-hop load
    # (worker SIGKILL during stage-2 BGE int8 inference + Gemini retry
    # buffers). Bumped to 1600m 2026-04-28 with operator approval; iter-04
    # owns proper memory engineering (smaller stage1_k, batched encoding).
    # 2 GB droplet still leaves ~350 MB for caddy + system.
    mem_limit: 1600m
    memswap_limit: 2600m
    pids_limit: 512
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m
      # PR #89 commit B (2026-05-25): PROMETHEUS_MULTIPROC_DIR moved off /tmp
      # to /app/var/prom to escape the host-side /tmp wipe that hit the
      # 2026-05-25 Naruto live repro. But /app lives on the read-only rootfs,
      # so we must declare it as a writable tmpfs mount here. ~32 small .db
      # files × 2 workers ≈ <1 MB typical, 64 MB cap with appuser ownership.
      # Wipe-on-restart is preserved (upstream prometheus_client guidance:
      # "directory must be wiped between Gunicorn runs").
      - /app/var/prom:size=64m,uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "--max-time", "2", "http://127.0.0.1:10000/api/health"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  zettelnet:
    external: true
